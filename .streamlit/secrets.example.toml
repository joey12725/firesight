# Copy to .streamlit/secrets.toml (git-ignored). Everything here is optional:
# with no secrets the app stores accounts in .firesight/users.json and
# FIRESight GPT stays switched off.

# FIRESight GPT on the Claude API
# ANTHROPIC_API_KEY = "sk-ant-..."
# FIRESIGHT_MODEL = "claude-opus-5-5"

# ...or on Amazon Bedrock (uses your AWS credentials)
# FIRESIGHT_LLM_PROVIDER = "bedrock"
# FIRESIGHT_AWS_REGION = "us-east-1"

# Accounts in DynamoDB instead of the local JSON file
# (selected automatically when AWS keys are present)
# FIRESIGHT_BACKEND = "dynamodb"
# FIRESIGHT_TABLE = "firesight-users"
# AWS_ACCESS_KEY_ID = "..."
# AWS_SECRET_ACCESS_KEY = "..."

# Require an invite code to create an account
# FIRESIGHT_SIGNUP_CODE = "..."
